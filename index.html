<!DOCTYPE html>

<html>
    <head>
        <title>Rock_Paper_Scissor</title>
        <style>
            button {
                padding: 10px 20px;
                margin-left: 5px;
                margin-right: 5px;
            }
        </style>
    </head>

    <body>
        <h1>Hi, there!<br></h1>
        <div id="result"></div>
        <div id="score"></div>
        
        <script>
            function getComputerChoice() {
                let randomNUmber = Math.floor(Math.random() * 3);
                if (randomNUmber === 0) {
                    return "Rock";
                } else if (randomNUmber === 1) {
                    return "Paper";
                } else if (randomNUmber === 2) {
                    return "Scissor";
                }
            }


            function playRound(humanChoice, computerChoice) {
                    if (humanChoice === "Rock" && computerChoice === "Rock") {
                        return "Draw"
                    } else if (humanChoice === "Rock" && computerChoice === "Paper") {
                        return "You lose"
                    } else if (humanChoice === "Rock" && computerChoice === "Scissor") {
                        return "You won"
                    } else if (humanChoice === "Paper" && computerChoice === "Rock") {
                        return "You won"
                    } else if (humanChoice === "Paper" && computerChoice === "Paper") {
                        return "Draw"
                    } else  if (humanChoice === "Paper" && computerChoice === "Scissor") {
                        return "You lose"
                    } else if (humanChoice === "Scissor" && computerChoice === "Rock") {
                        return "You lose"
                    } else if (humanChoice === "Scissor" && computerChoice === "Paper") {
                        return "You won"
                    } else if (humanChoice === "Scissor" && computerChoice === "Scissor") {
                        return "Draw"
                    }
                }

            
            function playGame() {
                let playerScore = 0;
                let computerScore = 0;

                ["Rock", "Paper", "Scissor"].forEach(choice => {
                    const bodyDiv = document.querySelector("body");
                    const btn = document.createElement("button");
                    btn.innerText = choice;
                    btn.value = choice;
                    bodyDiv.appendChild(btn);

                    btn.addEventListener("click", ()=> {
                        const playerSelection = btn.value;
                        const computerSelection = getComputerChoice();
                        const result = playRound(playerSelection, computerSelection);
                        const divScore = document.querySelector("#score");
                        const divResult = document.querySelector("#result");
                        
                        if (result.includes("won")) {
                            playerScore++;
                        } else if (result.includes("lose")) {
                            computerScore++;
                        }
                        divResult.textContent = `You chose: ${playerSelection}, Computer chose: ${computerSelection} & results: ${result}`
                        divScore.textContent = `Player Score: ${playerScore}, Computer Score: ${computerScore}`;                      

                        if (playerScore === 5) {
                            divResult.textContent = "🎉 Congratulations! You won the game!";
                            disableButton();
                        } else if (computerScore === 5) {
                            divResult.textContent = "💻 The computer won the game!";
                            disableButton();
                        }
                    })
                    function disableButton() {
                        document.querySelectorAll("button").forEach(button => {
                            button.disabled = true;
                        })
                    }
                })   
            }
                    
            playGame()

        </script>
    </body>
</html>
